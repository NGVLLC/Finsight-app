<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinSight - TradingView Live</title>
<script src="https://s3.tradingview.com/tv.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0e17;color:white;padding:0}
.header{text-align:center;padding:20px 15px 10px}
.header h1{font-size:32px;color:#00ff88}
.header p{color:#888;margin-top:5px}
.search-box{background:#151a26;padding:15px;border-radius:15px;display:flex;gap:10px;margin:15px;flex-wrap:wrap}
.search-box input{flex:1;padding:14px;border:none;border-radius:10px;background:#0a0e17;color:white;font-size:16px;outline:none;min-width:200px}
.search-box button{padding:14px 25px;background:#00ff88;color:black;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:16px}
.quick{margin:10px 15px;display:flex;gap:8px;flex-wrap:wrap}
.quick button{padding:8px 14px;background:#1e2536;color:white;border:1px solid #333;border-radius:20px;cursor:pointer}
.quick button:hover{background:#00ff88;color:black}
.box{background:#151a26;border-radius:15px;margin:15px;overflow:hidden;padding:10px}
.box h2{padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
.mini{height:150px}
.main-chart{height:500px;width:100%}
.footer{text-align:center;color:#555;margin:20px;font-size:12px}
</style>
</head>
<body>
<div class="header">
<h1>💰 FinSight</h1>
<p>Live Markets • Powered by TradingView</p>
<p style="color:#00ff88;font-size:12px">● REAL LIVE DATA - No Loading Issues</p>
</div>
<div class="tradingview-widget-container">
<div class="tradingview-widget-container__widget"></div>
<script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
{
"symbols": [
{"proName": "FOREXCOM:SPXUSD","title": "S&P 500"},
{"proName": "FOREXCOM:NSXUSD","title": "US 100"},
{"proName": "FX_IDC:EURUSD","title": "EUR to USD"},
{"proName": "BITSTAMP:BTCUSD","title": "Bitcoin"},
{"proName": "BITSTAMP:ETHUSD","title": "Ethereum"},
{"proName": "TVC:GOLD","title": "Gold"},
{"proName": "TVC:USOIL","title": "Oil"},
{"proName": "NASDAQ:AAPL","title": "Apple"},
{"proName": "NASDAQ:TSLA","title": "Tesla"},
{"proName": "NASDAQ:NVDA","title": "Nvidia"}
],
"showSymbolLogo": true,
"colorTheme": "dark",
"isTransparent": false,
"displayMode": "adaptive",
"locale": "en"
}
</script>
</div>
<div class="search-box">
<input id="searchInput" placeholder="Type symbol... e.g. TSLA, NVDA, BTCUSD" value="AAPL">
<button onclick="changeSymbol()">🔍 LOAD CHART</button>
</div>
<div class="quick">
<button onclick="setSym('NASDAQ:AAPL','Apple')">Apple</button>
<button onclick="setSym('NASDAQ:TSLA','Tesla')">Tesla</button>
<button onclick="setSym('NASDAQ:NVDA','Nvidia')">Nvidia</button>
<button onclick="setSym('NASDAQ:MSFT','Microsoft')">Microsoft</button>
<button onclick="setSym('NASDAQ:AMZN','Amazon')">Amazon</button>
<button onclick="setSym('NASDAQ:GOOGL','Google')">Google</button>
<button onclick="setSym('NASDAQ:META','Meta')">Meta</button>
<button onclick="setSym('NASDAQ:NFLX','Netflix')">Netflix</button>
<button onclick="setSym('BITSTAMP:BTCUSD','Bitcoin')">Bitcoin</button>
<button onclick="setSym('TVC:GOLD','Gold')">Gold</button>
<button onclick="setSym('TVC:USOIL','Oil')">Oil</button>
<button onclick="setSym('OANDA:XAUUSD','Gold Spot')">Gold Spot</button>
</div>
<div class="box">
<h2>📈 <span id="chartTitle">Apple - AAPL</span> - Live TradingView Chart</h2>
<div id="tv_chart" class="main-chart"></div>
</div>
<div class="box">
<h2>🔥 Top Movers - Live Prices</h2>
<div class="grid">
<div class="mini" id="w1"></div>
<div class="mini" id="w2"></div>
<div class="mini" id="w3"></div>
<div class="mini" id="w4"></div>
<div class="mini" id="w5"></div>
<div class="mini" id="w6"></div>
</div>
</div>
<div class="box">
<h2>🥇 Gold - Live</h2>
<div id="tv_gold" style="height:350px"></div>
</div>
<div class="footer">FinSight • Data by TradingView • Not financial advice</div>
<script>
let widget=null;
function createChart(symbol){
  if(widget) widget.remove();
  widget = new TradingView.widget({
    "autosize": true,
    "symbol": symbol,
    "interval": "D",
    "timezone": "Africa/Nairobi",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "enable_publishing": false,
    "allow_symbol_change": true,
    "container_id": "tv_chart"
  });
}
function createMini(id, symbol){
  new TradingView.widget({
    "autosize": true,
    "symbol": symbol,
    "interval": "D",
    "timezone": "Africa/Nairobi",
    "theme": "dark",
    "style": "1",
    "locale": "en",
    "enable_publishing": false,
    "hide_top_toolbar": true,
    "hide_legend": false,
    "container_id": id
  });
}
function setSym(sym, name){
  document.getElementById('chartTitle').textContent = name + ' - ' + sym;
  document.getElementById('searchInput').value = sym;
  createChart(sym);
  window.scrollTo({top: 350, behavior:'smooth'});
}
function changeSymbol(){
  let v = document.getElementById('searchInput').value.trim().toUpperCase();
  if(!v) return;
  if(v==="BTC"||v==="BTCUSD") v="BITSTAMP:BTCUSD";
  else if(v==="GOLD"||v==="XAUUSD") v="TVC:GOLD";
  else if(!v.includes(":")){
    if(["AAPL","TSLA","NVDA","MSFT","AMZN","GOOGL","META","NFLX","AMD","INTC"].includes(v)) v="NASDAQ:"+v;
    else v="NASDAQ:"+v;
  }
  setSym(v, v);
}
createChart("NASDAQ:AAPL");
createMini("w1","NASDAQ:AAPL");
createMini("w2","NASDAQ:TSLA");
createMini("w3","NASDAQ:NVDA");
createMini("w4","BITSTAMP:BTCUSD");
createMini("w5","TVC:GOLD");
createMini("w6","NASDAQ:MSFT");
new TradingView.widget({
  "autosize": true,
  "symbol": "TVC:GOLD",
  "interval": "D",
  "timezone": "Africa/Nairobi",
  "theme": "dark",
  "style": "1",
  "locale": "en",
  "enable_publishing": false,
  "container_id": "tv_gold"
});
</script>
</body>
</html>
